paths = ['(^|/)SOURCE-SNAPSHOT\.json$']
regexes = [
  'correct-horse-battery-staple-9f3k',
  'sk_test_51Hx9ZqLkJv8Q2wE7rT5yU3iO1pA0sD',
  '(?i)api\.stripe\.com:8443/v1/charges',
]
