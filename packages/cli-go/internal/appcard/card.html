<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Secret Handoff</title>
<!-- MCP App card (io.modelcontextprotocol/ui, spec 2026-01-26). It shows the
     tool call's arguments and result text only. It has no input field and no
     network access: the secret is typed only on the local fill page. -->
<style>
:root {
  color-scheme: light;
  --paper: #F8F9FC; --surface: #FFFFFF; --ink: #171C27; --muted: #566174;
  --line: #D9DFE8; --accent: #3154E8; --mark: #3154E8; --soft: #EEF1FF;
  --error: #B83240; --success: #246B50;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0D111B; --surface: #171E2C; --ink: #EDF1FA; --muted: #AFBBD0;
  --line: #303C51; --accent: #9DADFF; --mark: #6680FF; --soft: #202F50;
  --error: #FFADB5; --success: #A2D9BA;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0D111B; --surface: #171E2C; --ink: #EDF1FA; --muted: #AFBBD0;
    --line: #303C51; --accent: #9DADFF; --mark: #6680FF; --soft: #202F50;
    --error: #FFADB5; --success: #A2D9BA;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
/* The card is self-contained. Use a native fallback when brand fonts are absent. */
body { color: var(--ink); font: 14px/1.55 "Instrument Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.card { padding: 18px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; line-height: 1; letter-spacing: -.035em; white-space: nowrap; }
.mark { width: 26px; height: 26px; flex: none; fill: var(--mark); }
h1 { margin: 20px 0 16px; font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -.035em; overflow-wrap: anywhere; }
dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 12px 16px; }
dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
dd.reason { font-size: 14px; }
dd .hint { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
.mono { font: 12.5px/1.6 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
.status { display: flex; gap: 9px; align-items: baseline; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.status .mark-dot { font-weight: 600; flex: none; }
.status.wait { color: var(--accent); }
.status.error { color: var(--error); }
.status.ok { color: var(--success); }
.status.stop { color: var(--muted); }
.pairing { margin-top: 10px; font: 600 18px/1.5 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; overflow-wrap: anywhere; }
.foot { margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
@media (max-width: 380px) {
  .card { padding: 16px; }
  h1 { font-size: 22px; }
  dl { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  dt:not(:first-child) { margin-top: 9px; }
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M8 8h12v16h14l-8 12h-6v20H8V8Zm36 0h12v48H44V40H30l8-12h6V8Z"/>
      </svg>
      Secret Handoff
    </span>
  </div>
  <h1 id="title">Secret request</h1>
  <dl id="rows"></dl>
  <div id="status" class="status wait" role="status" aria-live="polite"><span class="mark-dot">●</span><span class="text">Waiting for you on the page in your browser.</span></div>
  <div id="pairing" class="pairing" hidden></div>
  <p class="foot">You type the secret on the Secret Handoff page in your own browser, never in this chat.</p>
</div>
<script>
"use strict";
(() => {
  // Agent-supplied text is shown only through textContent, never as HTML.
  const $ = (id) => document.getElementById(id);
  const parent = window.parent;
  let nextId = 1;
  const pending = new Map();
  let kind = "request_secret";
  let args = {};

  const send = (msg) => parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve) => {
    const id = nextId++;
    pending.set(id, resolve);
    send({ id, method, params });
  });
  const notify = (method, params) => send({ method, params });

  const list = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === "string") : []);
  const policyLine = (p) => {
    if (!p || typeof p !== "object") return "";
    const h = list(p.hosts);
    if (!h.length) return "";
    const m = list(p.methods), ps = list(p.paths);
    return [h.join(", "), m.length ? m.join(", ") : "any method", ps.length ? ps.join(", ") : "any path"].join(" · ");
  };
  const resultText = (r) => {
    const blocks = r && Array.isArray(r.content) ? r.content : [];
    return blocks.map((b) => (b && typeof b.text === "string" ? b.text : "")).join("\n");
  };
  const firstSentence = (t) => { const m = /^.*?[.!?](?=\s|$)/s.exec(t.trim()); return (m ? m[0] : t.trim()).slice(0, 300); };

  // The same reading of the binary's result text as the Claude Code card.
  const statusOf = (text, isError) => {
    if (isError) return { tone: "error", text: firstSentence(text) || "The call failed." };
    const pairing = (/pairing code ([0-9A-Z]{5}-[0-9A-Z]{4}-[0-9A-Z]{4})/.exec(text) || [])[1];
    if (/ is ready\./.test(text)) return { tone: "ok", text: "Ready. The agent uses the secret by name and never sees it." };
    if (/confirmation code/.test(text)) return { tone: "wait", text: "Filled. Read the confirmation code on your page to the agent." };
    if (/has no browser/.test(text) || /agent client is showing a page/.test(text)) return { tone: "wait", text: "Open the link on your phone or another computer. Continue only if it shows this pairing code.", code: pairing, remote: true };
    if (/^Waiting for the user to approve/.test(text)) return { tone: "wait", text: "Waiting for you to approve the command on the page in your browser." };
    if (/^Waiting for the user/.test(text)) return { tone: "wait", text: "Still waiting for you on the page in your browser." };
    if (/declined|did not approve/.test(text)) return { tone: "stop", text: kind === "run_with_secret" ? "You denied the command. It did not run." : "You declined. The agent did not get a secret." };
    if (/cancelled/.test(text)) return { tone: "stop", text: "Cancelled. Any value was discarded." };
    if (/expired/.test(text)) return { tone: "stop", text: "The request expired." };
    if (/did not finish within/.test(text)) return { tone: "error", text: firstSentence(text) };
    const exit = (/^exit code: (-?\d+)/m.exec(text) || [])[1];
    if (exit !== undefined) return exit === "0" ? { tone: "ok", text: "The command ran. Exit code 0." } : { tone: "error", text: "The command ran. Exit code " + exit + "." };
    return { tone: "ok", text: firstSentence(text) };
  };

  const marks = { ok: "✓", wait: "●", stop: "–", error: "!" };
  const setStatus = (s) => {
    const el = $("status");
    el.className = "status " + s.tone;
    el.querySelector(".mark-dot").textContent = marks[s.tone];
    el.querySelector(".text").textContent = s.text;
    $("pairing").hidden = !s.code;
    $("pairing").textContent = s.code || "";
    reportSize();
  };

  const row = (label, value, cls) => {
    if (!value) return;
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    if (cls) dd.className = cls;
    dd.textContent = value;
    if (cls === "reason") {
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = "  written by the agent";
      dd.append(hint);
    }
    $("rows").append(dt, dd);
  };

  const showInput = (a) => {
    args = a || {};
    $("rows").textContent = "";
    if ("command" in args) {
      kind = "run_with_secret";
      $("title").textContent = "Command with secrets";
      row("Command", list(args.command).join(" "), "mono");
      row("Secrets", list(args.secrets).join(", "), "mono");
      setStatus({ tone: "wait", text: "Waiting for you to approve the command on the page in your browser." });
    } else if ("code" in args) {
      kind = "confirm_secret";
      $("title").textContent = "Confirm " + (typeof args.name === "string" ? args.name : "");
      setStatus({ tone: "wait", text: "Checking the confirmation code." });
    } else {
      kind = "request_secret";
      $("title").textContent = typeof args.name === "string" && args.name ? args.name : "Secret request";
      row("Reason", typeof args.reason === "string" && args.reason ? "“" + args.reason + "”" : "(no reason given)", "reason");
      row("Can go to", policyLine(args.policy));
      setStatus({ tone: "wait", text: "Waiting for you on the page in your browser." });
    }
  };

  const applyTheme = (ctx) => {
    if (ctx && (ctx.theme === "light" || ctx.theme === "dark")) document.documentElement.dataset.theme = ctx.theme;
  };

  let lastHeight = 0;
  const reportSize = () => {
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h && h !== lastHeight) {
      lastHeight = h;
      notify("ui/notifications/size-changed", { width: Math.ceil(document.documentElement.scrollWidth), height: h });
    }
  };

  window.addEventListener("message", (event) => {
    if (event.source !== parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      pending.get(msg.id)(msg.result || {});
      pending.delete(msg.id);
      return;
    }
    switch (msg.method) {
      case "ui/notifications/tool-input": showInput((msg.params || {}).arguments); break;
      case "ui/notifications/tool-result": { const r = msg.params || {}; setStatus(statusOf(resultText(r), r.isError === true)); break; }
      case "ui/notifications/tool-cancelled": setStatus({ tone: "stop", text: "Cancelled." }); break;
      case "ui/notifications/host-context-changed": applyTheme(msg.params); break;
      case "ui/resource-teardown": if (msg.id !== undefined) send({ id: msg.id, result: {} }); break;
    }
  });

  new ResizeObserver(reportSize).observe(document.documentElement);
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    clientInfo: { name: "secrethandoff-card", version: "1" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then((result) => {
    applyTheme(result.hostContext);
    notify("ui/notifications/initialized", {});
    reportSize();
  });
})();
</script>
</body>
</html>
