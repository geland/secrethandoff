name: Release CLI

# A tag cli-vX.Y.Z publishes a GitHub release. A manual run builds and
# packages only, and keeps the assets as a workflow artifact.
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/cli-go
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli-go/go.mod
          cache-dependency-path: packages/cli-go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Tag matches the version in main.go
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: test "cli-v$(go run . version)" = "$GITHUB_REF_NAME"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build the six targets
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" go run ./release build
      - uses: actions/upload-artifact@v5
        with:
          name: bin
          path: packages/cli-go/dist/bin
          retention-days: 3

  sign-macos:
    environment: apple-signing
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_APPLE_SECRETS: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: bin
          path: packages/cli-go/dist/bin
      - name: Require signing credentials
        if: env.HAS_APPLE_SECRETS != 'true'
        run: |
          echo "::error::Apple signing secrets are missing. See packages/cli-go/scripts/sign-macos.sh."
          exit 1
      - name: Sign and notarize
        if: env.HAS_APPLE_SECRETS == 'true'
        working-directory: packages/cli-go
        run: bash scripts/sign-macos.sh
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - uses: actions/upload-artifact@v5
        with:
          name: bin-signed
          path: packages/cli-go/dist/bin
          retention-days: 3

  package:
    needs: sign-macos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: packages/cli-go
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli-go/go.mod
          cache-dependency-path: packages/cli-go/go.sum
      - uses: actions/download-artifact@v5
        with:
          name: bin-signed
          path: packages/cli-go/dist/bin
      - name: Package
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in cli-v*) ;; *) tag="cli-v$(go run . version)" ;; esac
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" go run ./release package \
            -base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: packages/cli-go/dist/release/secrethandoff_*
      - uses: actions/upload-artifact@v5
        with:
          name: release
          path: packages/cli-go/dist/release
          retention-days: 14
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/cli-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "secrethandoff ${GITHUB_REF_NAME#cli-v}" \
            --notes "Verify a download: gh attestation verify <file> --repo ${GITHUB_REPOSITORY}" \
            dist/release/secrethandoff_* dist/release/SHA256SUMS dist/release/manifest.json
