name: CLI checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cli-go
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli-go/go.mod
          cache-dependency-path: packages/cli-go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build all targets
        run: go run ./release build
